server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # POST /api/refresh re-polls every drawn circle (minutes with adsb.lol rate limits) and the first
    # replay request builds the day's GDELT cache (~10-15 min on a fresh clone). nginx's 60 s default
    # returned 504 for both, so allow long upstream responses on the API path.
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }

  # index.html must never be cached: it names the hashed bundle of THIS build. A cached index after a
  # rebuild keeps loading the previous bundle (or a bundle that no longer exists) and looks like an old build.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    add_header Pragma "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";   # content-hashed, safe to cache
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
